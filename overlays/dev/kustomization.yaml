apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-dev
resources:
- ../../base
replicas:
- name: web-app
  count: 1
images:
- name: nginx
  newTag: 1.25-alpine
configMapGenerator:
- name: app-config
  behavior: merge
  literals:
  - APP_ENV=development
generatorOptions:
  disableNameSuffixHash: true
