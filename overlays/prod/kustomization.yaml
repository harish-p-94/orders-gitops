apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-prod
resources:
- ../../base
replicas:
- name: web-app
  count: 3
images:
- name: nginx
  newTag: 1.26-alpine
configMapGenerator:
- name: app-config
  behavior: merge
  literals:
  - APP_ENV=production
generatorOptions:
  disableNameSuffixHash: true
